name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh project data for this deployment
        env:
          GH_TOKEN: ${{ secrets.ALL_REPOSITORY_DATA }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing ALL_REPOSITORY_DATA repository secret."
            exit 1
          fi

          query='query {
            viewer {
              repositories(
                first: 100
                ownerAffiliations: OWNER
                orderBy: {field: UPDATED_AT, direction: DESC}
              ) {
                nodes {
                  id
                  name
                  description
                  url
                  homepageUrl
                  repositoryTopics(first: 20) {
                    nodes {
                      topic {
                        name
                      }
                    }
                  }
                }
              }
            }
          }'

          gh api graphql -f query="$query" > /tmp/github-repositories.json

          jq '
            .data.viewer.repositories.nodes
            | map(
                . + {
                  topics: (
                    [.repositoryTopics.nodes[].topic.name | ascii_downcase]
                  )
                }
              )
            | map(
                select(
                  (.topics | index("ready"))
                  or (.topics | index("wip"))
                )
              )
            | map({
                id: .name,
                description: (.description // "No description provided."),
                link: (.homepageUrl // .url),
                snapshotUrl: null,
                tags: .topics
              })
          ' /tmp/github-repositories.json \
            > src/component/pages/projects/content/project/project-data.json

          echo "Generated project count:"
          jq 'length' src/component/pages/projects/content/project/project-data.json
          jq -e 'length > 0' src/component/pages/projects/content/project/project-data.json > /dev/null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

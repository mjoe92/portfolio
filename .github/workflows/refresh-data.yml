name: Refresh Project Data

on:
  workflow_dispatch:  # manual trigger only from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout data branch (create if missing)
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0
        continue-on-error: true

      - name: Initialize data branch if it does not exist
        run: |
          if ! git show-ref --verify --quiet refs/heads/data; then
            git checkout --orphan data
            git rm -rf . || true
            mkdir -p public/data
            echo '[]' > public/data/repos.json
            git add public/data/repos.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: initialize data branch"
            git push origin data
          fi

      - name: Fetch repos with v1.0/v1.0.0 tag
        env:
          GH_TOKEN: ${{ secrets.ALL_REPOSITORY_DATA }}
        run: |
          mkdir -p public/data

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/repos?sort=updated&per_page=100&affiliation=owner" \
            -o /tmp/all_repos.json

          IS_ARRAY=$(jq 'if type == "array" then true else false end' /tmp/all_repos.json)
          if [ "$IS_ARRAY" != "true" ]; then
            echo "ERROR: GitHub API did not return an array. Response:"
            cat /tmp/all_repos.json
            exit 1
          fi

          echo "Total repos fetched: $(jq 'length' /tmp/all_repos.json)"
          echo '[]' > /tmp/filtered_repos.json

          for REPO in $(jq -r '.[].name' /tmp/all_repos.json); do
            TAGS=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/mjoe92/$REPO/tags")

            IS_TAGS_ARRAY=$(echo "$TAGS" | jq 'if type == "array" then true else false end')
            if [ "$IS_TAGS_ARRAY" != "true" ]; then
              echo "Skipping $REPO (tags API error)"
              continue
            fi

            HAS_TAG=$(echo "$TAGS" | jq '[.[].name] | map(select(. == "v1.0" or . == "v1.0.0")) | length > 0')
            if [ "$HAS_TAG" = "true" ]; then
              echo "  Including: $REPO"
              jq --arg repo "$REPO" '
                . as $all
                | ([$all[] | select(.name == $repo)][0])
                | {
                    id: .name,
                    title: .name,
                    description: (.description // "No description provided."),
                    snapshotUrl: null,
                    tags: (.topics // []),
                    link: .html_url
                  }
              ' /tmp/all_repos.json | jq -s '.[0]' > /tmp/repo_entry.json
              jq --slurpfile entry /tmp/repo_entry.json '. += $entry' /tmp/filtered_repos.json > /tmp/filtered_tmp.json
              mv /tmp/filtered_tmp.json /tmp/filtered_repos.json
            fi
          done

          cp /tmp/filtered_repos.json public/data/repos.json
          echo "Total projects included: $(jq 'length' public/data/repos.json)"
          jq '.[].title' public/data/repos.json

      - name: Commit and push to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/repos.json
          git diff --cached --quiet \
            && echo "No changes — skipping commit" \
            || (git commit -m "chore: refresh repos.json $(date -u '+%Y-%m-%d %H:%M UTC')" && git push origin data)
